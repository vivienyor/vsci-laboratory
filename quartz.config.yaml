# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Vivien Yor - VSCI Laboratory
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: false # Полностью выключено, чтобы статьи не всплывали при наведении
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: vivienyor.github.io/vsci-laboratory
  ignorePatterns:
    - private
    - templates
    - .obsidian
    # ФИКС 1: Добавляем папку analysis в игнорирование, она СОВСЕМ исчезнет с сайта
    - analysis 
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"

plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      hidePropertiesView: true
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
  - source: "@quartz-community/crawl-links"
    enabled: true
  - source: "@quartz-community/description"
    enabled: true
  - source: "@quartz-community/latex"
    enabled: true
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: true
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true

  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      limit: 20            # Выводить ровно до 20 статей
      showTags: false      # Скрываем теги, оставляем только названия
      showDate: true       # Обязательно выводим дату
      linkToMore: false    # Убираем лишнюю кнопку перехода
      includeFuture: true  # Страховка, чтобы статьи не исчезали из-за часовых поясов
    layout:
      position: beforeBody # Выводит список по центру страницы под заголовком

  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
    
  # ФИКС 2: Настройка бокового меню (Включаем жесткий порядок разделов)
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
    options:
      title: "Explorer"
      showRoot: false # Скрывает ненужный заголовок "Home"
      order:
        - index
        - concepts
        - about

  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
  - source: "@quartz-community/tag-list"
    enabled: false
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
  - source: "@quartz-community/bases-page"
    enabled: true
    order: 50
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    order: 50
    
  # ФИКС ПОДВАЛА: Ссылка теперь ведет четко на ваш профиль ORCID
  - source: "@quartz-community/footer"
    enabled: true
    layout:
      position: footer
    options:
      links:
        "ORCID Profile": "https://orcid.org"

layout:
  groups:
    toolbar:
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    # 1. ГЛАВНАЯ СТРАНИЦА: Возвращаем стабильную структуру
    index:
      exclude:
        - article-title
      positions:
        beforeBody: ["breadcrumbs", "recent-notes"] # Ставим обратно сюда для стабильности
        left: ["page-title", "toolbar", "explorer"]
        right: ["graph", "backlinks"]
        footer: ["footer"]

    # 2. СТРАНИЦЫ ABOUT И CONCEPTS
    content:
      exclude:
        - recent-notes
        - page-list
      positions:
        beforeBody: ["breadcrumbs", "article-title", "content-meta"]
        left: ["page-title", "toolbar", "explorer"]
        right: ["graph", "backlinks"]
        footer: ["footer"]
    # 3. Страницы папок-разделов
    folder:
      exclude:
        - reader-mode
        - recent-notes
        - graph
        - backlinks
        - explorer
      positions:
        beforeBody: ["breadcrumbs", "article-title"]
        left: ["page-title", "toolbar"]
        right: []
        footer: ["footer"]
    tag:
      exclude:
        - reader-mode
        - recent-notes
      positions:
        right: []
    canvas: {}
    bases: {}


customStyles: |
  /* 1. Перенос длинных строк в сайдбаре */
  .explorer a, .explorer span, .explorer div, .explorer .folder-outer a {
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
    max-width: 100% !important;
    display: inline-block !important;
    word-break: break-word !important;
  }
  .explorer li {
    text-overflow: unset !important;
    white-space: normal !important;
  }
  
  /* 2. Скрытие технических системных блоков */
  .frontmatter, .yaml-frontmatter, .properties, .content-meta { 
    display: none !important; 
  }
  .explorer .page-title { 
    text-transform: none !important; 
    display: block !important; 
  }

  /* 3. Скрытие копирайта Quartz в подвале */
  footer p, footer a[href*="quartz"] {
    display: none !important;
  }

  /* 4. ЖЕСТКИЙ CSS-ФИКС ДЛЯ БОКОВОГО МЕНЮ */
  /* Оставляем ТОЛЬКО папки-разделы, полностью скрывая файлы одиночных статей */
  .explorer li.file, .explorer .folder-container .file, [class*="explorer"] li.file {
    display: none !important;
  }
  
  /* Принудительный правильный порядок в меню: Vivien -> Concepts -> About */
  [class*="explorer"] ul, .explorer ul { display: flex !important; flex-direction: column !important; }
  [class*="explorer"] li:has(a[href="/"]), .explorer li:has(a[href="/"]) { order: 1 !important; }
  [class*="explorer"] li:has(a[href*="concepts"]), .explorer li:has(a[href*="concepts"]) { order: 2 !important; }
  [class*="explorer"] li:has(a[href*="about"]), .explorer li:has(a[href*="about"]) { order: 3 !important; }

  /* 5. ТОТАЛЬНОЕ УНИЧТОЖЕНИЕ СПИСКОВ RECENT NOTES И ВРЕМЕНИ ЧТЕНИЯ НА СТРАНИЦАХ ABOUT И CONCEPTS */
  /* Скрываем заголовки Recent Notes, даты, метаданные, время чтения (2 min read) и списки страниц */
  .recent-notes, 
  [class*="recent-notes"], 
  .page-list, 
  [class*="page-list"], 
  .section-summary, 
  .content-meta,
  [class*="content-meta"],
  .read-time,
  article > h1 + p,
  article > h1 + ul {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
    height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 6. ИСКЛЮЧЕНИЕ ДЛЯ ГЛАВНОЙ СТРАНИЦЫ */
  /* Возвращаем отображение списка статей ТОЛЬКО на главной странице сайта */
  body[data-slug="index"] .recent-notes,
  body[data-slug="index"] [class*="recent-notes"] {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
    height: auto !important;
  }

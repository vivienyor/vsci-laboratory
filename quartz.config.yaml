# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Vivien Yor - VSCI Laboratory
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: false
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: vivienyor.github.io/vsci-laboratory
  ignorePatterns:
    - "private"
    - "templates"
    - ".obsidian"
    - "**/analysis/**"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"

plugins:
  - source: "@quartz-community/frontmatter"
    enabled: true
  - source: "@quartz-community/created-modified-date"
    enabled: true
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      hidePropertiesView: true
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
  - source: "@quartz-community/crawl-links"
    enabled: true
  - source: "@quartz-community/description"
    enabled: true
  - source: "@quartz-community/latex"
    enabled: true
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: true
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true

  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      limit: 20
      showTags: false
      showDate: true
      linkToMore: false
      includeFuture: true
    layout:
      position: beforeBody

  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
    
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
    options:
      title: "Explorer"
      showRoot: false
      folderDefaultState: "open"

  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
  - source: "@quartz-community/tag-list"
    enabled: false
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false

  - source: "@quartz-community/footer"
    enabled: true
    layout:
      position: footer
    options:
      links:
        "ORCID Profile": "https://orcid.org"

layout:
  groups:
    toolbar:
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    # На главной странице рендерится только сайдбар, список статей и граф
    index:
      exclude:
        - article-title
        - content-meta
      positions:
        beforeBody: ["breadcrumbs", "recent-notes"]
        left: ["page-title", "toolbar", "explorer"]
        right: ["graph", "backlinks"]
        footer: ["footer"]
    # На трех внутренних страницах (sparks, concepts, about) список recent-notes ПОЛНОСТЬЮ ОТКЛЮЧЕН
    content:
      exclude:
        - recent-notes
        - page-list
      positions:
        beforeBody: ["breadcrumbs", "article-title", "content-meta"]
        left: ["page-title", "toolbar", "explorer"]
        right: ["graph", "backlinks"]
        footer: ["footer"]
    folder:
      exclude:
        - reader-mode
        - recent-notes
        - graph
        - backlinks
        - explorer
      positions:
        beforeBody: ["breadcrumbs", "article-title"]
        left: ["page-title", "toolbar"]
        right: []
        footer: ["footer"]
    tag:
      exclude:
        - reader-mode
        - recent-notes
      positions:
        right: []
    canvas: {}
    bases: {}

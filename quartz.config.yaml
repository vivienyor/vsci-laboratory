# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Vivien Yor - VSCI Laboratory
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: false
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: vivienyor.github.io/vsci-laboratory
  ignorePatterns:
    - "private"
    - "templates"
    - ".obsidian"
    - "**/analysis/**"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#707070"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"

plugins:
  - source: "@quartz-community/frontmatter"
    enabled: true
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
  - source: "@quartz-community/created-modified-date"
    enabled: true
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      hidePropertiesView: true
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      mermaid: true
      mermaidTheme: "neutral"
  - source: "@quartz-community/crawl-links"
    enabled: true
  - source: "@quartz-community/description"
    enabled: true
  - source: "@quartz-community/latex"
    enabled: true
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: true
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      limit: 20
      showTags: false
      showDate: true
      linkToMore: false
      includeFuture: true
    layout:
      position: beforeBody
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
    options:
      title: "Explorer"
      showRoot: false
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
  - source: "@quartz-community/tag-list"
    enabled: false
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
  - source: "@quartz-community/bases-page"
    enabled: true
    order: 50
  - source: "@quartz-community/footer"
    enabled: true
    layout:
      position: footer
    options:
      links:
        "ORCID Profile": "https://orcid.org/0009-0009-7030-8151"


layout:
  groups:
    toolbar:
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    index:
      exclude:
        - article-title
        - content-meta
      positions:
        beforeBody: ["breadcrumbs", "recent-notes"]
        left: ["page-title", "toolbar", "explorer"]
        right: ["graph", "backlinks"]
        footer: ["footer"]
    "index/sparks":
      exclude:
        - recent-notes
        - page-list
      positions:
        beforeBody: ["breadcrumbs", "article-title"]
        left: ["page-title", "toolbar", "explorer"]
        right: ["graph", "backlinks"]
        footer: ["footer"]
    content:
      exclude:
        - recent-notes
        - page-list
      positions:
        beforeBody: ["breadcrumbs", "article-title", "content-meta"]
        left: ["page-title", "toolbar", "explorer"]
        right: ["graph", "backlinks"]
        footer: ["footer"]
    folder:
      exclude:
        - reader-mode
        - recent-notes
        - graph
        - backlinks
        - explorer
      positions:
        beforeBody: ["breadcrumbs", "article-title"]
        left: ["page-title", "toolbar"]
        right: []
        footer: ["footer"]
    tag:
      exclude:
        - reader-mode
        - recent-notes
      positions:
        right: []
    canvas: {}
    bases: {}

# ВСТРАИВАНИЕ КАСТОМНЫХ СТИЛЕЙ
customStyles: |
  /* 1. Перенос длинных строк в сайдбаре */
  .explorer a, .explorer span, .explorer div, .explorer .folder-outer a {
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
    max-width: 100% !important;
    display: inline-block !important;
    word-break: break-word !important;
  }
  .explorer li {
    text-overflow: unset !important;
    white-space: normal !important;
  }
  
  /* 2. Скрытие технических системных блоков */
  .frontmatter, .yaml-frontmatter, .properties, .content-meta { 
    display: none !important; 
  }
  .explorer .page-title { 
    text-transform: none !important; 
    display: block !important; 
  }

  /* 3. Скрытие копирайта Quartz в подвале */
  footer p, footer a[href*="quartz"] {
    display: none !important;
  }

  /* 4. ЖЕСТКИЙ CSS-ФИКС ДЛЯ БОКОВОГО МЕНЮ */
  .explorer li.file, .explorer .folder-container .file, [class*="explorer"] li.file {
    display: none !important;
  }
  
  [class*="explorer"] ul, .explorer ul { display: flex !important; flex-direction: column !important; }
  [class*="explorer"] li:has(a[href="/"]), .explorer li:has(a[href="/"]) { order: 1 !important; }
  [class*="explorer"] li:has(a[href*="concepts"]), .explorer li:has(a[href*="concepts"]) { order: 2 !important; }
  [class*="explorer"] li:has(a[href*="about"]), .explorer li:has(a[href*="about"]) { order: 3 !important; }

  /* 5. ТОТАЛЬНОЕ УНИЧТОЖЕНИЕ СПИСКОВ RECENT NOTES НА ВСЕХ СТРАНИЦАХ КРОМЕ ГЛАВНОЙ */
  .recent-notes, 
  [class*="recent-notes"], 
  .page-list, 
  [class*="page-list"], 
  .section-summary, 
  .content-meta,
  [class*="content-meta"],
  .read-time,
  article > h1 + p,
  article > h1 + ul {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
    height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* ЖЕСТКИЙ БАН RECENT NOTES КОНКРЕТНО ДЛЯ СТРАНИЦЫ SPARKS ПО ЕЕ СЛУГУ */
  body[data-slug*="sparks"] .recent-notes,
  body[data-slug*="sparks"] [class*="recent-notes"],
  main[data-slug*="sparks"] .recent-notes {
    display: none !important;
    height: 0 !important;
    opacity: 0 !important;
    visibility: hidden !important;
  }

  /* 6. ИСКЛЮЧЕНИЕ ДЛЯ ГЛАВНОЙ СТРАНИЦЫ */
  body[data-slug="index"] .recent-notes,
  body[data-slug="index"] [class*="recent-notes"] {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
    height: auto !important;
    margin: revert !important;
    padding: revert !important;
  }

  /* 7. ПРИНУДИТЕЛЬНЫЙ КРИСТАЛЬНЫЙ ФИКС ЛИНИЙ ГРАФА ДЛЯ СВЕТЛОЙ ТЕМЫ */
  body:not([user-theme="dark"]) .graph-outer svg line,
  body:not([user-theme="dark"]) .graph-outer svg .edge,
  body:not([user-theme="dark"]) svg g.links line,
  body:not([user-theme="dark"]) .graph-outer line {
    stroke: #505050 !important;
    stroke-opacity: 0.8 !important;
    stroke-width: 1.5px !important;
  }
  /* ХИРУРГИЧЕСКОЕ УНИЧТОЖЕНИЕ НАПЛЫВА SPARKS ВНУТРИ СПИСКА RECENT NOTES */
  .recent-notes li:has(a[href*="sparks"]),
  [class*="recent-notes"] li:has(a[href*="sparks"]),
  .recent-notes a[href*="sparks"] {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
    height: 0 !important;
    width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  /* 8. ПРИНУДИТЕЛЬНАЯ ОТРИСОВКА ВНУТРЕННИХ ГРАФОВ MERMAID В SPA-РЕЖИМЕ */
  .mermaid, 
  [class*="mermaid"],
  .mermaid svg,
  div.mermaid {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
    height: auto !important;
    min-height: 200px !important;
    margin: 20px auto !important;
    text-align: center !important;
  }

  /* Исправление контрастности нитей и блоков Mermaid в светлой теме */
  body:not([user-theme="dark"]) .mermaid svg {
    filter: none !important;
  }
  body:not([user-theme="dark"]) .mermaid .node rect,
  body:not([user-theme="dark"]) .mermaid .node circle,
  body:not([user-theme="dark"]) .mermaid .node polygon {
    fill: #f0f4f8 !important;
    stroke: #284b63 !important;
    stroke-width: 2px !important;
  }
  body:not([user-theme="dark"]) .mermaid .edgePath .path {
    stroke: #404040 !important;
    stroke-width: 1.5px !important;
  }
  body:not([user-theme="dark"]) .mermaid .labelText,
  body:not([user-theme="dark"]) .mermaid tspan {
    fill: #2b2b2b !important;
    font-weight: 500 !important;
  }
  /* 9. Контрастный text для всех внутренних схем Mermaid */
  .mermaid text, 
  .mermaid span, 
  .mermaid tspan, 
  .mermaid .node text {
    fill: #2b2b2b !important;
    color: #2b2b2b !important;
    opacity: 1 !important;
  }
  .mermaid .edgePath .path, 
  .mermaid .arrowMarkerPath {
    stroke: #404040 !important;
  }
  
  /* 10. ФИКС НЕВИДИМОСТИ И СХЛОПЫВАНИЯ СХЕМ MERMAID ПРИ SPA ПЕРЕХОДАХ */
  .mermaid, 
  pre.mermaid,
  div.mermaid,
  .mermaid svg {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
    min-height: 250px !important;
    height: auto !important;
    background: var(--light) !important;
  }
